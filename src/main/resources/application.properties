profile.active: dev, test, prod
spring.application.name=ForoHubAPI
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST}/foro_hub_api
spring.datasource.username=root
spring.datasource.password=${MY_SQL_PASSWORD}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=jdbc:mysql://${DB_HOST}/foro_hub_api
spring.flyway.user=root
spring.flyway.password=${MY_SQL_PASSWORD}

api.security.secret=ty

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
server.error.include-stacktrace=never